name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:win -- --publish never
      - name: Publish updater files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Unwind-Setup-*.exe
            release/Unwind-Setup-*.exe.blockmap
            release/Unwind-Portable-*.exe
            release/latest.yml
